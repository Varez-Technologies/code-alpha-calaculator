<button class="keycap group relative h-12 rounded-lg bg-surface-container-lowest active:translate-y-[2px] transition-all flex items-center justify-center shadow-[0_3px_0_#C4BCB3,0_4px_6px_rgba(0,0,0,0.10)] active:shadow-[0_1px_0_#C4BCB3,0_1px_2px_rgba(0,0,0,0.15)]" data-key="dot" type="button">
<div class="absolute inset-x-1.5 top-0.5 h-[1px] bg-white/90 rounded-full pointer-events-none"></div>
<span class="w-1.5 h-1.5 rounded-full bg-on-surface"></span>
</button>
<!-- Equals [=] -->
<button class="keycap group relative h-12 rounded-lg bg-primary text-on-primary active:translate-y-[2px] transition-all flex items-center justify-center shadow-[0_3px_0_#7F2B00,0_5px_8px_rgba(163,57,0,0.30)] active:shadow-[0_1px_0_#7F2B00,0_1px_2px_rgba(163,57,0,0.40)]" data-key="equals" type="button">
<div class="absolute inset-x-1.5 top-0.5 h-[1px] bg-white/50 rounded-full pointer-events-none"></div>
<span class="font-headline-sm text-headline-sm font-semibold">=</span>
</button>
</div>

<!-- Calculator Footer Info -->
<div class="pt-space-md flex items-center justify-between px-space-xs">
<span class="font-label-sm text-[9px] text-tertiary uppercase tracking-wider">CODEALPHA TASK</span>
<span class="font-label-sm text-[9px] text-outline uppercase tracking-widest">FRONTEND INTERNSHIP</span>
</div>
</div>

<!-- Collapsible Calculation History Tape Drawer -->
<div class="w-[96%] mt-2 bg-surface-container-low rounded-lg p-space-sm shadow-[0_2px_8px_rgba(40,32,24,0.06)] transition-all duration-300 hidden" id="tape-drawer">
<div class="flex items-center justify-between pb-1 mb-1">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[14px] text-tertiary">description</span>
<span class="font-label-sm text-[10px] uppercase tracking-wider font-semibold text-on-surface">CALCULATION HISTORY</span>
</div>
<button class="font-label-sm text-[10px] text-tertiary hover:text-error transition-colors uppercase" id="btn-tape-clear" type="button">
          Clear History
        </button>
</div>
<!-- Calculation History Roll -->
<div class="max-h-28 overflow-y-auto flex flex-col gap-1 pr-1 font-label-md text-[11px] text-tertiary" id="tape-content">
<div class="flex justify-between items-center py-0.5 text-outline">
<span>HISTORY READY</span>
<span>0.00</span>
</div>
</div>
</div>

</div>
</div>
<script>
  (function () {
    // State variables: track current number, previous number, and pending operator
    let currentInput = '0';
    let previousOperand = null;
    let activeOperator = null;
    let resetInputOnNextDigit = false;
    let decimalMode = 'float'; // 'float', '2', '0'
    let angleMode = 'DEG'; // 'DEG' or 'RAD'
    let memoryValue = 0;

    // Cache DOM element references
    const displayEl = document.getElementById('calc-display');
    const expressionEl = document.getElementById('calc-expression');
    const clearBtnLabel = document.getElementById('btn-clear-label');
    const annDeg = document.getElementById('ann-deg');
    const annRad = document.getElementById('ann-rad');
    const annMem = document.getElementById('ann-mem');
    const annErr = document.getElementById('ann-err');
    const opButtons = document.querySelectorAll('.op-key');
    const tapeContent = document.getElementById('tape-content');
    const tapeDrawer = document.getElementById('tape-drawer');

    // Plays a soft audio click on button press for tactile feedback
    let audioCtx = null;
    function playTactileClick() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (audioCtx) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.02);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.02);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.02);
        }
      } catch (e) {
        // Fallback silently if audio context restricted by browser policy
      }
    }

    // Helper: Formats numbers with comma separators for clean readability
    function formatDisplayNumber(str) {
      if (str === 'ERROR') return 'ERROR';
      if (!str) return '0';
      
      const parts = str.split('.');
      const integerPart = parts[0];
      const hasDecimal = parts.length > 1;
      const formattedInteger = Number(integerPart).toLocaleString('en-US');
      
      if (hasDecimal) {
        return formattedInteger + '.' + parts[1];
      }
      return formattedInteger;
    }

    // Updates the screen display and switches between C and AC labels
    function updateDisplay() {
      if (currentInput === 'ERROR') {
        displayEl.textContent = 'Err';
        annErr.classList.remove('opacity-0');
        annErr.classList.add('opacity-100');
        return;
      }

      annErr.classList.remove('opacity-100');
      annErr.classList.add('opacity-0');

      let formatted = formatDisplayNumber(currentInput);
      displayEl.textContent = formatted;

      // Switch clear button label: C when there is an active input, AC when fully reset
      if (currentInput !== '0' || previousOperand !== null) {
        clearBtnLabel.textContent = 'C';
      } else {
        clearBtnLabel.textContent = 'AC';
      }
    }

    // Appends calculation steps and results to the history tape roll
    function appendTapeEntry(expr, result) {
      if (!tapeContent) return;
      const row = document.createElement('div');
      row.className = 'flex justify-between items-center py-0.5 hover:text-on-surface cursor-pointer';
      row.innerHTML = `
        <span class="truncate max-w-[160px]">${expr}</span>
        <span class="font-semibold text-on-surface">${formatDisplayNumber(String(result))}</span>
      `;
      row.addEventListener('click', () => {
        playTactileClick();
        currentInput = String(result);
        resetInputOnNextDigit = true;
        updateDisplay();
      });
      tapeContent.appendChild(row);
      tapeContent.scrollTop = tapeContent.scrollHeight;
    }

    // Performs arithmetic calculation based on chosen operator (+, -, ×, ÷)
    function computeResult() {
      if (previousOperand === null || activeOperator === null) return;
      
      const prev = parseFloat(previousOperand);
      const curr = parseFloat(currentInput);
      let res = 0;

      switch (activeOperator) {
        case '+':
          res = prev + curr;
          break;
        case '−':
          res = prev - curr;
          break;
        case '×':
          res = prev * curr;
          break;
        case '÷':
          if (curr === 0) {
            currentInput = 'ERROR';
            updateDisplay();
            return;
          }
          res = prev / curr;
          break;
      }

      // Apply decimal rounding if fixed precision mode is active
      if (decimalMode === '2') {
        res = Math.round(res * 100) / 100;
      } else if (decimalMode === '0') {
        res = Math.round(res);
      }

      const expressionString = `${formatDisplayNumber(String(prev))} ${activeOperator} ${formatDisplayNumber(String(curr))}`;
      appendTapeEntry(expressionString, res);

      currentInput = String(res);
      previousOperand = null;
      activeOperator = null;
      resetInputOnNextDigit = true;
      expressionEl.textContent = expressionString + ' =';

      // Reset active operator highlights
      opButtons.forEach(btn => {
        btn.querySelector('.op-indicator').classList.remove('opacity-100');
        btn.querySelector('.op-indicator').classList.add('opacity-0');
      });

      updateDisplay();
    }

    // Number button click handlers: appends digits to display
    document.querySelectorAll('[data-num]').forEach(btn => {
      btn.addEventListener('click', () => {
        playTactileClick();
        const num = btn.getAttribute('data-num');

        if (resetInputOnNextDigit || currentInput === '0' || currentInput === 'ERROR') {
          currentInput = num;
          resetInputOnNextDigit = false;
        } else {
          if (currentInput.replace('.', '').length < 9) {
            currentInput += num;
          }
        }
        updateDisplay();
      });
    });

    // Decimal point button: prevents multiple decimal dots
    document.querySelector('[data-key="dot"]').addEventListener('click', () => {
      playTactileClick();
      if (resetInputOnNextDigit || currentInput === 'ERROR') {
        currentInput = '0.';
        resetInputOnNextDigit = false;
      } else if (!currentInput.includes('.')) {
        currentInput += '.';
      }
      updateDisplay();
    });

    // Operator buttons (+, -, ×, ÷): stores current operand and sets active operator
    opButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        playTactileClick();
        const op = btn.getAttribute('data-op');

        if (activeOperator !== null && !resetInputOnNextDigit) {
          computeResult();
        }

        previousOperand = currentInput;
        activeOperator = op;
        resetInputOnNextDigit = true;
        expressionEl.textContent = `${formatDisplayNumber(currentInput)} ${op}`;

        // Highlight selected operator button
        opButtons.forEach(b => {
          const dot = b.querySelector('.op-indicator');
          if (b === btn) {
            dot.classList.remove('opacity-0');
            dot.classList.add('opacity-100');
          } else {
            dot.classList.remove('opacity-100');
            dot.classList.add('opacity-0');
          }
        });
      });
    });

    // Equals button: calculates final result
    document.querySelector('[data-key="equals"]').addEventListener('click', () => {
      playTactileClick();
      computeResult();
    });

    // Clear / All Clear button
    document.querySelector('[data-key="clear"]').addEventListener('click', () => {
      playTactileClick();
      if (clearBtnLabel.textContent === 'C') {
        currentInput = '0';
      } else {
        currentInput = '0';
        previousOperand = null;
        activeOperator = null;
        expressionEl.textContent = 'READY';
        opButtons.forEach(b => {
          b.querySelector('.op-indicator').classList.remove('opacity-100');
          b.querySelector('.op-indicator').classList.add('opacity-0');
        });
      }
      updateDisplay();
    });

    // Plus / Minus Sign Toggle button (±)
    document.querySelector('[data-key="sign"]').addEventListener('click', () => {
      playTactileClick();
      if (currentInput !== '0' && currentInput !== 'ERROR') {
        currentInput = currentInput.startsWith('-') ? currentInput.slice(1) : '-' + currentInput;
        updateDisplay();
      }
    });

    // Percentage button (%): divides number by 100
    document.querySelector('[data-key="percent"]').addEventListener('click', () => {
      playTactileClick();
      if (currentInput !== 'ERROR') {
        const val = parseFloat(currentInput) / 100;
        currentInput = String(val);
        updateDisplay();
      }
    });

    // Precision Switch: allows setting floating point, 2 decimal places, or whole integer
    const fltBtn = document.getElementById('slider-flt');
    const twoBtn = document.getElementById('slider-2');
    const zeroBtn = document.getElementById('slider-0');

    function setActivePrecisionButton(activeBtn, mode) {
      playTactileClick();
      decimalMode = mode;
      [fltBtn, twoBtn, zeroBtn].forEach(b => {
        b.className = 'px-2 py-0.5 rounded text-[10px] font-label-sm font-medium text-tertiary hover:text-on-surface transition-all';
      });
      activeBtn.className = 'px-2 py-0.5 rounded text-[10px] font-label-sm font-semibold bg-surface shadow-[0_1px_2px_rgba(0,0,0,0.1)] text-on-surface transition-all';
    }

    fltBtn.addEventListener('click', () => setActivePrecisionButton(fltBtn, 'float'));
    twoBtn.addEventListener('click', () => setActivePrecisionButton(twoBtn, '2'));
    zeroBtn.addEventListener('click', () => setActivePrecisionButton(zeroBtn, '0'));

    // DEG / RAD Angle Unit Mode Toggle
    const degBtn = document.getElementById('btn-deg-toggle');
    const degLabel = document.getElementById('label-deg-mode');
    degBtn.addEventListener('click', () => {
      playTactileClick();
      if (angleMode === 'DEG') {
        angleMode = 'RAD';
        degLabel.textContent = 'RAD';
        annDeg.classList.add('opacity-25');
        annRad.classList.remove('opacity-25');
      } else {
        angleMode = 'DEG';
        degLabel.textContent = 'DEG';
        annDeg.classList.remove('opacity-25');
        annRad.classList.add('opacity-25');
      }
    });

    // Clear History Tape roll
    document.getElementById('btn-tape-clear').addEventListener('click', () => {
      playTactileClick();
      tapeContent.innerHTML = `
        <div class="flex justify-between items-center py-0.5 text-outline">
          <span>HISTORY CLEARED</span>
          <span>0.00</span>
        </div>
      `;
    });

    // History Tape drawer open / close toggle
    const tapeToggleBtn = document.getElementById('btn-tape-toggle');
    if (tapeToggleBtn && tapeDrawer) {
      tapeToggleBtn.addEventListener('click', () => {
        playTactileClick();
        tapeDrawer.classList.toggle('hidden');
      });
    }

    // Keyboard support: allows typing numbers and operators from keyboard or numpad
    window.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        const btn = document.querySelector(`[data-num="${e.key}"]`);
        if (btn) btn.click();
      } else if (e.key === '.') {
        document.querySelector('[data-key="dot"]').click();
      } else if (e.key === '=' || e.key === 'Enter') {
        document.querySelector('[data-key="equals"]').click();
      } else if (e.key === '+') {
        document.querySelector('[data-op="+"]').click();
      } else if (e.key === '-') {
        document.querySelector('[data-op="−"]').click();
      } else if (e.key === '*') {
        document.querySelector('[data-op="×"]').click();
      } else if (e.key === '/') {
        e.preventDefault();
        document.querySelector('[data-op="÷"]').click();
      } else if (e.key === 'Backspace') {
        playTactileClick();
        if (currentInput !== '0' && currentInput !== 'ERROR') {
          currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : '0';
          updateDisplay();
        }
      } else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') {
        document.querySelector('[data-key="clear"]').click();
      } else if (e.key === '%') {
        document.querySelector('[data-key="percent"]').click();
      }
    });
  })();
</script></main></body></html>
